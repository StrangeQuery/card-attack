# Card Attack's machines, as one Cargo package: each machine is a binary target, built for CARDIAC with
# `cargo cardiac build` (rust-cardiac's cargo subcommand), never with `cargo build`. A new machine needs a [[bin]] here.
[package]
name = "card-attack-machines"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[dependencies]
demokit = { path = "../demokit" }


